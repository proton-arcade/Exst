<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exst Arcade — quick-play browser games</title>
  <meta name="description" content="A fast arcade shelf powered by plain text files. Games and folders load from files in data/." />
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Exst Arcade home">
      <span class="brand-mark">EX</span>
      <span><strong>Exst Arcade</strong><small>copy · tweak · play</small></span>
    </a>
    <nav class="top-nav" aria-label="Primary navigation">
      <a href="#games">Games</a>
      <a href="#collections">Folders</a>
    </nav>
    <label class="open-mode" title="Choose how game buttons open">
      <span>Open games</span>
      <select id="openMode">
        <option value="page">game page</option>
        <option value="same">replace tab</option>
        <option value="new">new tab</option>
      </select>
    </label>
  </header>

  <main>
    <section id="games" class="section-block">
      <div class="section-title-row">
        <div>
          <p class="eyebrow">Games</p>
          <h1 class="section-heading">Top 10 most played games</h1>
        </div>
        <div class="shelf-search">
          <label for="searchInput">search (games or folders)</label>
          <input id="searchInput" type="search" placeholder="search (games or folders)" autocomplete="off" />
        </div>
      </div>
      <div id="gameGrid" class="game-grid" aria-live="polite"></div>
    </section>

    <section id="collections" class="section-block">
      <div class="section-title-row">
        <div>
          <p class="eyebrow">Folders</p>
          <h2 class="section-heading">Top 10 most played folders</h2>
        </div>
        <div class="stat-pack" id="stats" aria-live="polite"></div>
      </div>
      <div id="folderGrid" class="folder-grid" aria-live="polite"></div>
    </section>
  </main>

  <script src="assets/js/config-loader.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
