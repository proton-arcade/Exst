<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121212" />
    <title>Game folder — Exst Arcade</title>
    <meta
      name="description"
      content="A game collection from the Exst Arcade library."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Exst Arcade" />
    <meta property="og:title" content="Game folder — Exst Arcade" />
    <meta
      property="og:description"
      content="A handpicked collection from the Exst Arcade library."
    />
    <link
      rel="icon"
      href="assets/images/favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="apple-touch-icon"
      href="assets/images/apple-touch-icon.png"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="assets/css/arcade.css" />
    <link rel="stylesheet" href="assets/css/flix.css" />
  </head>
  <body class="folder-page">
    <noscript>
      <p style="padding: 1rem; text-align: center">
        This collection page needs JavaScript. Please enable JavaScript and
        reload this page.
      </p>
    </noscript>
    <header class="site-header compact">
      <a class="brand" href="../index.html"
        ><span class="brand-mark">ExstArcade</span
        ><span
          ><strong>Exst Arcade</strong
          ><small>Your curated collection</small></span
        ></a
      >
      <nav class="top-nav">
        <a href="../index.html#about">All folders</a
        ><a href="../index.html#search">All games</a>
      </nav>
      <label class="open-mode"
        ><span>Open games</span
        ><select id="openMode">
          <option value="page">game page</option>
          <option value="same">replace tab</option>
          <option value="new">new tab</option>
        </select></label
      >
    </header>
    <main>
      <section class="folder-hero" id="folderHero">
        <a class="back-chip" href="../index.html">← Back to arcade</a>
        <p class="eyebrow">Folder</p>
        <h1 id="folderTitle">Loading folder…</h1>
        <p id="folderDescription"></p>
        <p id="storageNote" class="storage-note"></p>
      </section>
      <!-- Populated when a catalog edit needs attention (see config-loader.js). -->
      <div id="folderNotice"></div>
      <section class="section-block full-list">
        <div class="section-title-row">
          <h2>Games in this folder</h2>
          <span id="folderCount" class="count-pill"></span>
        </div>
        <div id="folderGameGrid" class="game-grid" aria-live="polite"></div>
      </section>
    </main>
    <script src="data/games.js"></script>
    <script src="data/folders.js"></script>
    <script src="assets/js/config-loader.js"></script>
    <script src="assets/js/folder.js"></script>
  </body>
</html>
